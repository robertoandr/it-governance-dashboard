# ============================================
# pyproject.toml — Configuração Centralizada
# IT Governance Dashboard
# ============================================

[project]
name = "it-gov-dashboard"
version = "1.0.0"
description = "Dashboard de Governança de TI - Grupo Gadens"
requires-python = ">=3.12"

# ============================================
# Ruff — Linter + Formatter (substitui black+isort+flake8)
# ============================================
# Estratégia: foca em código de PRODUÇÃO do dashboard.
# Scripts one-shot de setup (cftv-setup/) são excluídos
# pois rodam fora do runtime de produção e têm riscos
# operacionais já mitigados por revisão manual e
# execução controlada via runbook.
# Ver docs/security/exceptions.md para justificativas.
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "cftv-setup",       # scripts one-shot de provisionamento Zabbix
    "zabbix-mcp-server", # repo Git separado (nested, não nosso código)
    ".governance",      # artefatos de governança (gerados)
    "venv",
    ".venv",
    "build",
    "dist",
    "_backups",
    "data",
    "htmlcov",
    "migrations",
    "node_modules",
    "alembic",          # arquivos gerados pelo Alembic (env.py, versions/)
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (formatter cuida)
    "S101",   # assert usado (ok em testes)
    "S104",   # bind 0.0.0.0 (controlado via FLASK_HOST env var)
    "S108",   # /tmp hardcoded (uso controlado em scripts)
    "S310",   # urllib URL (schemes validados em runtime via allowlist)
    "B008",   # function call in default arg (Flask usa muito)
    "RUF001", # ambiguous unicode (emojis intencionais em UI)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "N802", "B"]  # testes: asserts, nomes flexíveis
"config.py" = ["S105", "S106"]        # secrets vêm do .env
"scripts/**/*.py" = ["S"]             # diagnostic scripts

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================
# Pytest
# ============================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--color=yes",
    "--durations=10",
    "--cov=itgov",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html",
    "--cov-fail-under=85",
]
markers = [
    "slow: testes lentos (>1s)",
    "integration: testes de integração (Flask client)",
    "unit: testes unitários puros",
    "smoke: testes críticos de fumaça",
]
filterwarnings = [
    "ignore::DeprecationWarning:flask",
    "ignore::DeprecationWarning:werkzeug",
    "ignore::PendingDeprecationWarning",
]

# ============================================
# Coverage
# ============================================
[tool.coverage.run]
source = ["itgov"]
branch = true
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
    "_backups/*",
    "*/migrations/*",
    "setup.py",
    "cftv-setup/*",
]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@overload",
]
precision = 2
show_missing = true

# ============================================
# Mypy — Type Checking (gradual)
# ============================================
[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = false
exclude = ["venv", ".venv", "_backups", "tests", "cftv-setup"]

# ============================================
# Bandit — Security Scanner
# ============================================
# Skips justificados em docs/security/exceptions.md
[tool.bandit]
exclude_dirs = [
    "tests",
    "venv",
    ".venv",
    "_backups",
    "node_modules",
    ".governance",
    "cftv-setup",
    "scripts",
    "build",
    "dist",
]
skips = [
    "B101",  # assert_used (ok em código defensivo)
    "B104",  # bind 0.0.0.0 (controlado por FLASK_HOST env var)
    "B108",  # /tmp hardcoded (uso controlado em scripts one-shot)
    "B310",  # urllib URL (schemes validados via allowlist runtime)
]
