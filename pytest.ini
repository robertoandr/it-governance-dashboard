[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --durations=10

# Markers customizados
markers =
    slow: testes lentos (>1s)
    integration: testes de integração (Flask client)
    unit: testes unitários puros

# Ignorar warnings de deps externas
filterwarnings =
    ignore::DeprecationWarning:flask
    ignore::DeprecationWarning:werkzeug
