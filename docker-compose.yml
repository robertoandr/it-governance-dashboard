# IT Governance Dashboard — Docker Compose
# Usage:
#   make up          → dev stack (app + redis + influxdb)
#   make prod        → prod stack (+ nginx)
#   docker compose --profile prod up -d

networks:
  itgov-net:
    driver: bridge

volumes:
  app_logs:
  app_tmp:
  app_data:
  redis_data:
  influxdb_data:
  influxdb_config:
  grafana_data:

services:

  # ─── Application ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ghcr.io/robertoandr/it-governance-dashboard:latest
    container_name: itgov-app
    restart: unless-stopped
    env_file: .env
    environment:
      APP__ENVIRONMENT: production
      APP__HOST: "0.0.0.0"
      APP__PORT: "5000"
      LOGGING__FORMAT: json
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - app_logs:/app/logs
      - app_tmp:/app/tmp
      - app_data:/app/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - itgov-net

  # ─── Redis (session cache / rate-limit backend) ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: itgov-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - itgov-net

  # ─── InfluxDB (metrics store) ──────────────────────────────────────────────
  influxdb:
    image: influxdb:2.7-alpine
    container_name: itgov-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:-ChangeMe2026!}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-gadens}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-govti}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-dev-token-change-in-prod}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    ports:
      - "${INFLUX_PORT:-8086}:8086"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - itgov-net

  # ─── Nginx (reverse proxy — prod profile only) ─────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: itgov-nginx
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - itgov-net

  # ─── Grafana (dashboards) ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: itgov-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ChangeMe!2026}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-dev-token-change-in-prod}
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ${INFLUX_ORG:-gadens}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-govti}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - itgov-net
