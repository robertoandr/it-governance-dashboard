networks:
  governance_net:
    driver: bridge
    # internal: true removido — grafana da stack existente (it-gov-dashboard_itgov-net)
    # precisa alcançar o InfluxDB. Em produção, conectar o container grafana
    # à governance_net via: docker network connect governance_net itgov-grafana

volumes:
  influxdb_data:
  influxdb_config:

services:
  influxdb:
    image: influxdb:2.7-alpine
    container_name: itgov-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-grupogadens}
      DOCKER_INFLUXDB_INIT_BUCKET: governance_raw
      DOCKER_INFLUXDB_INIT_RETENTION: 2160h
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    healthcheck:
      # Valida conectividade (/ping) E autenticação (bucket list)
      test:
        - CMD-SHELL
        - >
          influx ping --host http://localhost:8086 &&
          influx bucket list
          --host http://localhost:8086
          --token $$DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
          --org $$DOCKER_INFLUXDB_INIT_ORG
          > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - governance_net
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 512m
    labels:
      com.itgov.service: influxdb
      com.itgov.version: "2.7"

  influxdb-init:
    image: influxdb:2.7-alpine
    container_name: itgov-influxdb-init
    restart: "no"
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      INFLUX_HOST: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG:-grupogadens}
    volumes:
      - ./docker/influxdb:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/init-buckets.sh"]
    networks:
      - governance_net
