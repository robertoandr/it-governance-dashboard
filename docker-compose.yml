# IT Governance Dashboard — Docker Compose
# Usage:
#   make up          → dev stack (app + redis + influxdb)
#   make prod        → prod stack (+ nginx)
#   docker compose --profile prod up -d

networks:
  itgov-net:
    driver: bridge

volumes:
  app_logs:
  app_tmp:
  app_data:
  redis_data:
  influxdb_data:
  influxdb_config:
  grafana_data:
  collector_data:

services:

  # ─── Application ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ghcr.io/robertoandr/it-governance-dashboard:latest
    container_name: itgov-app
    restart: unless-stopped
    env_file: .env
    environment:
      APP__ENVIRONMENT: production
      APP__HOST: "0.0.0.0"
      APP__PORT: "5000"
      LOGGING__FORMAT: json
      # InfluxDB — override single-underscore .env vars with double-underscore
      # so Pydantic nested settings (env_nested_delimiter="__") picks them up.
      # INFLUX_URL in .env points to native host InfluxDB; inside Docker the
      # service is reachable as http://influxdb:8086 on the itgov-net network.
      INFLUX__URL: "http://influxdb:8086"
      INFLUX__TOKEN: "${INFLUX_TOKEN}"
      INFLUX__ORG: "${INFLUX_ORG:-gadens}"
      INFLUX__BUCKET: "${INFLUX_BUCKET:-govti}"
      INFLUX__BUCKET_RAW: "${INFLUX_BUCKET_RAW:-governance_raw}"
      INFLUX__ENABLED: "true"
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - app_logs:/app/logs
      - app_tmp:/app/tmp
      - app_data:/app/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - itgov-net

  # ─── Redis (session cache / rate-limit backend) ────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: itgov-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - itgov-net

  # ─── InfluxDB (metrics store) ──────────────────────────────────────────────
  influxdb:
    image: influxdb:2.7-alpine
    container_name: itgov-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-grupogadens}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-governance_raw}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    ports:
      - "${INFLUX_PORT:-8086}:8086"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - itgov-net

  # ─── Nginx (reverse proxy — prod profile only) ─────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: itgov-nginx
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - itgov-net

  # ─── Collector (APScheduler: GitHub PR + PATs + Gitleaks) ────────────────────
  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    image: it-gov-dashboard-collector:latest
    container_name: itgov-collector
    restart: unless-stopped
    environment:
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      GITHUB_ORG: "${GITHUB_ORG:-robertoandr}"
      GITHUB_REPOS: "${GITHUB_REPOS:-}"
      INFLUX_URL: "http://influxdb:8086"
      INFLUX_TOKEN: "${INFLUX_TOKEN}"
      INFLUX_ORG: "${INFLUX_ORG:-grupogadens}"
      INFLUX_BUCKET_RAW: "${INFLUX_BUCKET_RAW:-governance_raw}"
      POSTGRES_DSN: "${POSTGRES_DSN:-}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      TZ: "${TZ:-America/Sao_Paulo}"
      AZURE_TENANT_ID: "${AZURE_TENANT_ID:-}"
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID:-}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET:-}"
      M365_TENANT_DOMAIN: "${M365_TENANT_DOMAIN:-}"
      # AD + WinRM patch collector (NTLM — servidor Linux fora do domínio)
      LDAP_SERVER: "${LDAP_SERVER:-}"
      LDAP_BASE_DN: "${LDAP_BASE_DN:-}"
      LDAP_BIND_DN: "${LDAP_BIND_DN:-}"
      LDAP_BIND_PASSWORD: "${LDAP_BIND_PASSWORD:-}"
      WINRM_USER: "${WINRM_USER:-}"
      WINRM_PASSWORD: "${WINRM_PASSWORD:-}"
      PATCH_THRESHOLD_DAYS: "${PATCH_THRESHOLD_DAYS:-35}"
      PATCH_MAX_WORKERS: "${PATCH_MAX_WORKERS:-20}"
      WINRM_TIMEOUT_S: "${WINRM_TIMEOUT_S:-30}"
      PATCH_STALE_MACHINE_DAYS: "${PATCH_STALE_MACHINE_DAYS:-60}"
      # Zabbix — coletor de riscos e disponibilidade
      ZABBIX_URL: "${ZABBIX_URL:-}"
      ZABBIX_TOKEN: "${ZABBIX_TOKEN:-}"
      ZABBIX_USER: "${ZABBIX_USER:-}"
      ZABBIX_PASSWORD: "${ZABBIX_PASSWORD:-}"
      # Acronis Cyber Cloud
      ACRONIS_BASE_URL: "${ACRONIS_BASE_URL:-}"
      ACRONIS_CLIENT_ID: "${ACRONIS_CLIENT_ID:-}"
      ACRONIS_CLIENT_SECRET: "${ACRONIS_CLIENT_SECRET:-}"
      # Alert job SMTP (complementado por smtp.env se presente)
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_TO: "${SMTP_TO:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
    volumes:
      - collector_data:/data
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - itgov-net

  # ─── Network Discovery (varredura de ativos de infra — perfil discovery) ─────
  network-discovery:
    build:
      context: .
      dockerfile: infra-setup/Dockerfile.discovery
    image: itgov-network-discovery:latest
    container_name: itgov-network-discovery
    restart: unless-stopped
    profiles: ["discovery"]
    cap_add:
      - NET_RAW       # nmap raw sockets
      - NET_ADMIN     # nmap OS detection
    network_mode: host  # acesso direto à rede corporativa para scan
    environment:
      ZABBIX_URL: "${ZABBIX_URL:-}"
      ZABBIX_TOKEN: "${ZABBIX_TOKEN:-}"
      INFLUX_URL: "http://127.0.0.1:8086"
      INFLUX_TOKEN: "${INFLUX_TOKEN:-}"
      INFLUX_ORG: "${INFLUX_ORG:-gadens}"
      INFLUX_BUCKET_RAW: "${INFLUX_BUCKET_RAW:-governance_raw}"
      INFRA_SCAN_RANGES: "${INFRA_SCAN_RANGES:-172.29.0.0/22}"
      INFRA_SCAN_INTERVAL: "${INFRA_SCAN_INTERVAL:-3600}"
      INFRA_NMAP_ARGS: "${INFRA_NMAP_ARGS:--T4 --host-timeout 10s}"
      TZ: "${TZ:-America/Sao_Paulo}"

  # ─── Grafana (dashboards) ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: itgov-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ChangeMe!2026}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-dev-token-change-in-prod}  # source of truth: .env
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ${INFLUX_ORG:-gadens}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-govti}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - itgov-net
