apiVersion: 1

datasources:
  - name: InfluxDB-Governanca
    type: influxdb
    access: proxy
    url: ${INFLUX_URL}
    isDefault: true
    jsonData:
      version: Flux
      organization: grupogadens
      defaultBucket: governanca-m365
      tlsSkipVerify: true
      httpMode: POST
    secureJsonData:
      token: ${INFLUX_TOKEN}
    editable: true
