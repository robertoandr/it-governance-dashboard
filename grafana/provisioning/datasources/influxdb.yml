apiVersion: 1

datasources:
  - name: InfluxDB-Governanca
    uid: InfluxDB-Governanca
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: false
    jsonData:
      version: Flux
      organization: $__env{INFLUX_ORG}
      defaultBucket: $__env{INFLUX_BUCKET}
      tlsSkipVerify: true
      httpMode: POST
    secureJsonData:
      token: $__env{INFLUX_TOKEN}
    editable: true
