# ============================================
# Pre-commit hooks — Quality Gate Local
# ============================================
# Setup: pip install pre-commit && pre-commit install
# Manual run: pre-commit run --all-files
# ============================================

repos:
  # ── Ruff: linter + formatter ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        types_or: [python, pyi, jupyter]  # exclui .md (ruff >=0.6 tenta formatar md, requer --preview)

  # ── Sanidade básica de arquivos ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']  # permite "  " no fim de linha .md (hard line break)
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
        exclude: ^data/
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # ── Gitleaks: secrets scanner ──
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
