# ============================================
# Pre-commit hooks — Quality Gate Local
# ============================================
# Setup: pip install pre-commit && pre-commit install
# Manual run: pre-commit run --all-files
# ============================================

repos:
  # ── Ruff: linter + formatter ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ── Sanidade básica de arquivos ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
        exclude: ^data/
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # ── Gitleaks: secrets scanner ──
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ── detect-secrets: heurística + baseline (camada 2) ──
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            .*\.lock|
            docs/postmortems/.*\.md|
            \.secrets\.baseline|
            cftv-setup/\.zabbix_config\.json
          )$

  # ── Bloqueia commit direto em main/master ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  # ── Mypy: type checking ──
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, types-requests, types-PyYAML]
        args: [--ignore-missing-imports, --explicit-package-bases]
        # Tech debt pré-existente excluído até mypy-cleanup PR
        exclude: ^(tests/|docs/|app\.py$|alembic/|cftv-setup/|collectors/|collector/|services/|itgov/|scripts/|app/services/metrics_aggregator\.py)

  # ── Hadolint: Dockerfile lint ──
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.0-beta
    hooks:
      - id: hadolint-docker
        files: Dockerfile.*
