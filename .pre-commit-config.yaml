# ============================================
# Pre-commit hooks — Quality Gate Local
# ============================================
# Setup: pip install pre-commit && pre-commit install
# Manual run: pre-commit run --all-files
# ============================================

repos:
  # ── Ruff: linter + formatter ──
  # Using repo:local to avoid pip 26.1.1 venv isolation bug on Python 3.12
  # (virtualenv 21.4.2 bundles pip-26.1.1 which has broken requests.compat).
  # System ruff (0.15.15) matches requirements-dev.txt and CI.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        language: system
        entry: ruff check --fix --exit-non-zero-on-fix
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff-format
        language: system
        entry: ruff format
        types_or: [python, pyi, jupyter]
        require_serial: true

  # ── Sanidade básica de arquivos ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
        exclude: ^data/
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # ── Gitleaks: secrets scanner ──
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
