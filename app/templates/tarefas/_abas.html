{# Abas do módulo Tarefas: Kanban próprio da TI e tarefas vindas do ClickUp. #}
{% set _aba = request.endpoint %}
<nav aria-label="Seções de Tarefas" class="flex gap-1 border-b border-slate-200 dark:border-slate-700">
  {% for endpoint, rotulo in [("tarefas.workspaces", "Kanban da TI"), ("tarefas.clickup", "ClickUp")] %}
  <a href="{{ url_for(endpoint) }}"
     {% if _aba == endpoint %}aria-current="page"{% endif %}
     class="-mb-px px-4 py-2 text-sm font-medium border-b-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400
            {% if _aba == endpoint %}border-blue-600 text-blue-700 dark:text-blue-400
            {% else %}border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200{% endif %}">
    {{ rotulo }}
  </a>
  {% endfor %}
</nav>
