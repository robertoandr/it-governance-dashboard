<header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700
              px-6 py-3 flex items-center justify-between shadow-sm flex-shrink-0">

  <!-- Left: hamburger + page title -->
  <div class="flex items-center gap-4">
    <button @click="toggleSidebar"
            class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 focus:outline-none transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <h1 class="text-base font-semibold text-slate-700 dark:text-slate-200">
      {% block page_title %}Dashboard{% endblock %}
    </h1>
  </div>

  <!-- Right: dark toggle + user chip + logout -->
  <div class="flex items-center gap-3">

    <!-- Dark mode toggle -->
    <button @click="toggleDark"
            class="w-8 h-8 flex items-center justify-center rounded-lg
                   text-slate-400 hover:text-slate-600 dark:hover:text-slate-200
                   hover:bg-slate-100 dark:hover:bg-slate-700 transition"
            title="Alternar tema">
      <svg x-show="dark" x-cloak class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
      </svg>
      <svg x-show="!dark" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
      </svg>
    </button>

    {% if current_user and current_user.is_authenticated %}
    <!-- User chip -->
    <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700">
      <div class="w-7 h-7 rounded-full bg-blue-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0">
        {{ current_user.name[0] | upper }}
      </div>
      <div class="leading-tight hidden sm:block">
        <p class="text-xs font-semibold text-slate-700 dark:text-slate-200 truncate max-w-[120px]">{{ current_user.name }}</p>
        <p class="text-[10px] text-slate-400 capitalize">{{ current_user.role }}</p>
      </div>
    </div>

    <!-- Logout -->
    <a href="{{ url_for('auth.logout') }}"
       class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium
              text-slate-500 hover:text-red-600 dark:text-slate-400 dark:hover:text-red-400
              hover:bg-red-50 dark:hover:bg-red-900/20 transition"
       title="Sair">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      <span class="hidden sm:inline">Sair</span>
    </a>
    {% endif %}

    <span class="bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300
                 rounded-full px-2.5 py-0.5 text-xs font-medium hidden md:inline">
      v{{ app_version }}
    </span>
  </div>
</header>
