<header class="bg-white border-b px-6 py-3 flex items-center justify-between shadow-sm">
  <div class="flex items-center gap-4">
    <button @click="toggleSidebar"
            class="text-gray-500 hover:text-gray-700 focus:outline-none">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <h1 class="text-lg font-semibold text-gray-700">{% block page_title %}Dashboard{% endblock %}</h1>
  </div>
  <div class="flex items-center gap-3 text-sm text-gray-500">
    <span>Atualizado agora</span>
    <span class="bg-blue-100 text-blue-700 rounded-full px-3 py-1 font-medium">v{{ app_version }}</span>
  </div>
</header>
