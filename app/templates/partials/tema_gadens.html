{#
  Tema "Gadens Institucional" — Modelo B: Linear & Vercel Aesthetic (Executive Minimalist).
  Superfícies carvão suave, bordas hairline de 1px, tipografia tabular e vermelho institucional Gadens.
#}
<link rel="stylesheet" href="{{ url_for('static', filename='fonts/app/fonts.css') }}">
<script nonce="{{ csp_nonce() }}">
  (function () {
    var grafite = {
      50: '#FAFAFA', 100: '#F2F2F5', 200: '#E6E6EA', 300: '#D0D0D7', 400: '#8E8E9A',
      500: '#666675', 600: '#3D3D47', 700: '#222228', 800: '#18181D', 900: '#121215', 950: '#0A0A0C'
    };
    var aco = {
      50: '#F5F7FA', 100: '#EBF0F5', 200: '#D5DFEA', 300: '#ABC0D6', 400: '#6B8FA7',
      500: '#3E6686', 600: '#2E4E6B', 700: '#243D54', 800: '#1B2E3F', 900: '#14222F', 950: '#0D161F'
    };
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: grafite, gray: grafite,
            blue: aco, indigo: aco, sky: aco, cyan: aco, purple: aco, violet: aco,
            gadens: {
              50: '#FEF2F2', 100: '#FCE4E4', 200: '#F9CBCC', 300: '#F3A3A6', 400: '#EC6F74',
              500: '#DF3D44', 600: '#C41E24', 700: '#A3181D', 800: '#8C181D', 900: '#74181C', 950: '#400809'
            }
          },
          fontFamily: {
            sans: ['"Source Sans 3"', 'ui-sans-serif', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  })();
  if (localStorage.theme === 'dark') document.documentElement.classList.add('dark');
</script>
<style nonce="{{ csp_nonce() }}">
  body { font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif; }
  .tabular-nums, .font-mono { font-variant-numeric: tabular-nums; }
  /* Linear aesthetic: bordas hairline limpas e controle de sombras turvas */
  .dark .shadow, .dark .shadow-md, .dark .shadow-lg, .dark .shadow-xl {
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
  }
  .status-OPERACIONAL { color: #10B981 !important; }
  .status-DEGRADADO   { color: #F59E0B !important; }
  .status-CRITICO     { color: #EF4444 !important; }
</style>
