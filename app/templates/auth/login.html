<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Governança de TI 360</title>
  <script src="{{ url_for('static', filename='vendor/tailwind.js') }}" nonce="{{ csp_nonce() }}"></script>
  <!-- Tema Gadens Institucional (cores, fonte e dark mode) — depois do tailwind.js -->
  {% include "partials/tema_gadens.html" %}
  <script defer src="{{ url_for('static', filename='vendor/alpine-csp.min.js') }}" nonce="{{ csp_nonce() }}"></script>
  <script nonce="{{ csp_nonce() }}">
  document.addEventListener('alpine:init', function () {
    Alpine.data('loginPage', function () {
      return {
        dark: localStorage.theme === 'dark',
        get darkClass() { return this.dark ? 'dark' : ''; },
        toggleDark: function () {
          this.dark = !this.dark;
          localStorage.theme = this.dark ? 'dark' : 'light';
        },
      };
    });
  });
  </script>
    <!-- Favicons - Grupo Gadens -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <meta name="theme-color" content="#c41e24">

</head>
<body class="h-full bg-slate-100 dark:bg-slate-900" x-data="loginPage" :class="darkClass">

<div class="min-h-full flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md">

    <!-- Logo/brand -->
    <div class="text-center mb-8">
      <img src="{{ url_for('static', filename='img/gadens-logo.png') }}" alt="Grupo Gadens"
           width="200" height="118" class="mx-auto mb-5 w-[200px] h-auto dark:hidden">
      <img src="{{ url_for('static', filename='img/gadens-logo-escuro.png') }}" alt="Grupo Gadens"
           width="200" height="118" class="mx-auto mb-5 w-[200px] h-auto hidden dark:block">
      <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Governança de TI 360</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Equipe de TI · Grupo Gadens</p>
    </div>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="mb-4 p-3 rounded-lg text-sm
            {% if cat == 'error' %}bg-red-50 text-red-700 border border-red-200 dark:bg-red-900/30 dark:text-red-300 dark:border-red-800
            {% else %}bg-blue-50 text-blue-700 border border-blue-200 dark:bg-blue-900/30 dark:text-blue-300 dark:border-blue-800{% endif %}">
            {{ msg }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Card -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-8">
      <h2 class="text-lg font-semibold text-slate-700 dark:text-slate-200 mb-6">Entrar na plataforma</h2>

      <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}" class="space-y-5">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email"
                 class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600
                        bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100
                        placeholder-slate-400 dark:placeholder-slate-500
                        focus:outline-none focus:ring-2 focus:ring-gadens-500 focus:border-transparent
                        text-sm transition"
                 placeholder="admin@ti.local"/>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Senha</label>
          <input id="password" name="password" type="password" required autocomplete="current-password"
                 class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600
                        bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100
                        focus:outline-none focus:ring-2 focus:ring-gadens-500 focus:border-transparent
                        text-sm transition"
                 placeholder="••••••••"/>
        </div>

        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-400 cursor-pointer">
            <input type="checkbox" name="remember" class="rounded border-slate-300 dark:border-slate-600 text-blue-600"/>
            Lembrar-me
          </label>
        </div>

        <button type="submit"
                class="w-full py-2.5 bg-gadens-600 hover:bg-gadens-700 active:bg-gadens-800
                       text-white font-semibold rounded-lg text-sm transition shadow-sm">
          Entrar
        </button>
      </form>
    </div>

    <!-- Dark mode toggle -->
    <div class="text-center mt-6">
      <button @click="toggleDark"
              class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
        <span x-show="!dark">&#9790; Modo escuro</span>
        <span x-show="dark" x-cloak>&#9728; Modo claro</span>
      </button>
    </div>

  </div>
</div>

<style nonce="{{ csp_nonce() }}">[x-cloak]{display:none!important}</style>
</body>
</html>
