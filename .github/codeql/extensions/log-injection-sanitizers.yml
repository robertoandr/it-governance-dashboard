# Models-as-data — schema oficial do codeql/python-all.
# Fonte: github/codeql/shared/mad/codeql/mad/static/ModelsAsData.qll
#
# summaryModel:
#   namespace, type, subtypes, name, signature, ext, input, output, kind, provenance
# neutralModel:
#   namespace, type, name, signature, kind, provenance
#
# Objetivo: ensinar o CodeQL a tratar `app_utils.safe_logging.safe()` como
# sanitizer de log-injection (CWE-117), eliminando falsos positivos.

extensions:
  # Summary: a função `safe` propaga taint do Argument[0] para ReturnValue
  # (a string sai sanitizada mas ainda é "a mesma string conceitualmente").
  - addsTo:
      pack: codeql/python-all
      extensible: summaryModel
    data:
      # namespace                , type, subtypes, name  , signature, ext, input        , output       , kind   , provenance
      - ["app_utils.safe_logging", ""  , False   , "safe", ""       , "" , "Argument[0]", "ReturnValue", "taint", "manual"]
      - ["app_utils"             , ""  , False   , "safe", ""       , "" , "Argument[0]", "ReturnValue", "taint", "manual"]

  # Neutral/sanitizer: marca como sanitizer para a query log-injection.
  - addsTo:
      pack: codeql/python-all
      extensible: neutralModel
    data:
      # namespace                , type, name  , signature, kind       , provenance
      - ["app_utils.safe_logging", ""  , "safe", ""       , "sanitizer", "manual"]
      - ["app_utils"             , ""  , "safe", ""       , "sanitizer", "manual"]
