# Models-as-data (MaD v2) — schema atual do CodeQL.
# Ensina o CodeQL a tratar app_utils.safe_logging.safe como sanitizer
# de log-injection (CWE-117).
#
# Schemas (CodeQL 2.25+):
#   summaryModel: type, path, input, output, kind, provenance
#   neutralModel: type, path, kind
#
# Docs: https://codeql.github.com/docs/codeql-language-guides/customizing-library-models-for-python/

extensions:
  # safe(value) -> ReturnValue propaga taint da Argument[0],
  # MAS marca o resultado como "sanitizer" para log-injection.
  - addsTo:
      pack: codeql/python-all
      extensible: summaryModel
    data:
      # type                       , path           , input          , output       , kind     , provenance
      - ["app_utils.safe_logging",   "Member[safe]",  "Argument[0]",   "ReturnValue", "taint",   "manual"]
      - ["app_utils",                "Member[safe]",  "Argument[0]",   "ReturnValue", "taint",   "manual"]

  # Marca a função como neutral / sanitizer para que log-injection NÃO dispare.
  - addsTo:
      pack: codeql/python-all
      extensible: neutralModel
    data:
      # type                       , path           , kind
      - ["app_utils.safe_logging",   "Member[safe]",  "sanitizer"]
      - ["app_utils",                "Member[safe]",  "sanitizer"]
