# Models-as-data para codeql/python-all (schema legado / ApiGraphModels).
#
# IMPORTANTE: o pack codeql/python-all (até 7.x) usa o schema LEGADO
# de 5 colunas para summaryModel e 3 para neutralModel — NÃO o schema
# novo de 10 colunas (ExtensionsSig) usado em Java/JS.
#
# Signatures (confirmadas pela mensagem de erro do CodeQL):
#   summaryModel(string type, string path, string input, string output, string kind)
#   neutralModel(string type, string path, string kind)
#
# Onde:
#   type   = pacote/módulo (ex: "app_utils.safe_logging")
#   path   = access path a partir do type (ex: "Member[safe]")
#   input  = de onde flui o taint (ex: "Argument[0]")
#   output = para onde flui (ex: "ReturnValue")
#   kind   = "taint" | "value" (summary) | "sanitizer" (neutral)
#
# Objetivo: tratar `app_utils.safe_logging.safe()` como sanitizer
# de log-injection (CWE-117), eliminando falsos positivos.

extensions:
  # Summary: taint flui de Argument[0] para ReturnValue passando por `safe`.
  - addsTo:
      pack: codeql/python-all
      extensible: summaryModel
    data:
      # type                     , path           , input        , output       , kind
      - ["app_utils.safe_logging", "Member[safe]" , "Argument[0]", "ReturnValue", "taint"]
      - ["app_utils"             , "Member[safe_logging].Member[safe]", "Argument[0]", "ReturnValue", "taint"]

  # Neutral: marca a função como sanitizer.
  - addsTo:
      pack: codeql/python-all
      extensible: neutralModel
    data:
      # type                     , path           , kind
      - ["app_utils.safe_logging", "Member[safe]" , "sanitizer"]
      - ["app_utils"             , "Member[safe_logging].Member[safe]", "sanitizer"]
