name: "IT Governance Dashboard CodeQL Config"

# Excluir scripts de diagnóstico (intencionalmente permitem TLS verify=False
# via env var, com warnings explícitos e default seguro)
paths-ignore:
  - 'scripts/diag_*.py'
  - '**/tests/**'
  - 'cftv-setup/**'

# Queries: usar suite security-and-quality
queries:
  - uses: security-and-quality
