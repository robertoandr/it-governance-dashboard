# ============================================
# Dependabot — atualização automática de deps
# Docs: https://docs.github.com/code-security/dependabot
# ============================================
version: 2
updates:
  # ----- Python dependencies -----
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    reviewers:
      - "Roberto"  # ajuste para seu username GitHub
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Agrupa atualizações patch/minor num único PR
      production-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignora major updates (revisão manual)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ----- GitHub Actions -----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
