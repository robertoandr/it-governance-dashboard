name: 🔐 Security Scan

on:
  pull_request:
    branches: [main, develop, "sprint-*/**", "sprint-*"]
  push:
    branches: [main]
  schedule:
    # Toda segunda 06:00 UTC (03:00 BRT) — varredura completa do histórico
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      deep_scan:
        description: 'Scan histórico completo (mais lento)'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # JOB 1: Gitleaks — secret detection
  # ============================================================
  gitleaks:
    name: 🔑 Gitleaks Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # histórico completo para scan profundo

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Necessário apenas para organizações > 25 colaboradores

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: gitleaks
        continue-on-error: true  # SARIF pode não existir se scan passou limpo

  # ============================================================
  # JOB 2: Pre-commit hooks — qualidade + secrets
  # ============================================================
  pre-commit:
    name: 🪝 Pre-commit Hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pre-commit
        run: pip install pre-commit==4.0.1

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  # ============================================================
  # JOB 3: Inventário de .env no servidor (schedule semanal)
  # ============================================================
  env-inventory:
    name: 📋 .env Inventory (scheduled)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify .env files are gitignored
        run: |
          echo "=== Verificando que nenhum .env está rastreado pelo git ==="
          TRACKED=$(git ls-files | grep -E '^\.env$|\.env\.local$|\.env\.[^e]' || true)
          if [[ -n "$TRACKED" ]]; then
            echo "❌ ERRO: Arquivos .env rastreados pelo git:"
            echo "$TRACKED"
            exit 1
          fi
          echo "✅ Nenhum arquivo .env rastreado pelo git"

      - name: Check .env.example is clean
        run: |
          echo "=== Verificando .env.example não contém valores reais ==="
          if grep -E '=[a-zA-Z0-9~._\-]{20,}' .env.example 2>/dev/null; then
            echo "❌ .env.example pode conter valores reais (strings longas)"
            exit 1
          fi
          echo "✅ .env.example parece limpo (sem valores longos)"
        continue-on-error: true
