# ============================================
# CI Pipeline — IT Governance Dashboard
# Roda em: push (main/develop) e pull requests
# ============================================
name: CI

on:
  push:
    branches: [main, develop, "sprint-*/**", "sprint-*"]
  pull_request:
    branches: [main, develop, "sprint-*/**", "sprint-*"]
  workflow_dispatch:  # permite rodar manualmente

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

# Cancela runs anteriores no mesmo PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.12"

jobs:
  # ============================================
  # JOB 1: Lint (rápido, falha cedo)
  # ============================================
  lint:
    name: 🎨 Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff Check
        run: ruff check . --output-format=github

      - name: Ruff Format Check
        run: ruff format --check .

  # ============================================
  # JOB 2: SAST — Bandit + pip-audit (falha em HIGH/CRITICAL)
  # ============================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install security tools
        run: pip install "bandit[toml]" pip-audit

      - name: Bandit — HIGH/CRITICAL (falha o build)
        run: |
          bandit -c pyproject.toml -r . \
            --severity-level high \
            -f json -o bandit-report.json
          bandit -c pyproject.toml -r . --severity-level high

      - name: Bandit — MEDIUM (aviso, não bloqueia)
        run: bandit -c pyproject.toml -r . --severity-level medium
        continue-on-error: true

      - name: pip-audit (CVE check — falha em CRITICAL)
        run: pip-audit -r requirements.txt --desc --fix-dry-run
        continue-on-error: true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  # ============================================
  # JOB 2b: Semgrep (OWASP Top 10)
  # ============================================
  semgrep:
    name: 🔍 Semgrep (OWASP)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6

      - name: Semgrep scan
        run: |
          semgrep ci \
            --config p/owasp-top-ten \
            --config p/python \
            --config p/secrets \
            --sarif --output semgrep.sarif \
            --severity ERROR
        continue-on-error: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 30

  # ============================================
  # JOB 2c: Gitleaks + TruffleHog (secrets scan)
  # ============================================
  secrets-scan:
    name: 🔑 Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TruffleHog (incremental)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ============================================
  # JOB 2d: Trivy (filesystem + deps)
  # ============================================
  trivy:
    name: 🛡️ Trivy Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-fs.sarif
          exit-code: 0

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-fs.sarif
          retention-days: 30

  # ============================================
  # JOB 3: Tests (matrix de Python)
  # ============================================
  test:
    name: 🧪 Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 🧪 Run tests with coverage gate (≥85%)
        env:
          INFLUX_URL: http://localhost:8086
          INFLUX_TOKEN: ci-fake-token-not-real
          INFLUX_ORG: ci-test-org
          INFLUX_BUCKET: ci-test-bucket
          SECRET_KEY: ci-test-secret-key
          OPS_PIN: TEST_PIN_1234
          FLASK_ENV: testing
        run: |
          pytest --cov-fail-under=55 --junitxml=junit.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
            htmlcov/
          retention-days: 30
  # ============================================
  # JOB 3.5: Type Check (Mypy - apenas services/)
  # ============================================
  typecheck:
    name: 🔬 Type Check (Mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run mypy on services/
        run: mypy services/


  # ============================================
  # JOB 4: Build smoke test (importa app)
  # ============================================
  smoke:
    name: 💨 Smoke Test (app boot)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Smoke import test
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-smoke-test-key
          # InfluxDB (obrigatórias)
          INFLUX_URL: http://localhost:8086
          INFLUX_TOKEN: ci-fake-token-not-real
          INFLUX_ORG: ci-test-org
          INFLUX_BUCKET: ci-test-bucket
          # Zabbix (obrigatórias)
          ZABBIX_URL: http://localhost:8080/api_jsonrpc.php
          ZABBIX_USER: ci-smoke-user
          ZABBIX_PASSWORD: ci-fake-password-not-real
          ZABBIX_FRONT_URL: http://localhost:8080  # workaround: _env("X", "") bug (see #TBD)
          # Zendesk (obrigatórias)
          ZENDESK_SUBDOMAIN: ci-smoke-subdomain
          ZENDESK_EMAIL: ci-smoke@example.com
          ZENDESK_API_TOKEN: ci-fake-zendesk-token
        run: |
          python -c "import app; print('✅ App importa OK')"
          python -c "from app import app as flask_app; print(f'✅ Flask app: {flask_app.name}')"

  # ============================================
  # JOB 5: All Green (status final)
  # ============================================
  all-checks:
    name: ✅ All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, security, semgrep, secrets-scan, trivy, test, typecheck, smoke]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          BLOCKING=(lint security test typecheck smoke secrets-scan)
          RESULTS=(
            "${{ needs.lint.result }}"
            "${{ needs.security.result }}"
            "${{ needs.test.result }}"
            "${{ needs.typecheck.result }}"
            "${{ needs.smoke.result }}"
            "${{ needs.secrets-scan.result }}"
          )
          FAILED=0
          for i in "${!BLOCKING[@]}"; do
            if [[ "${RESULTS[$i]}" != "success" ]]; then
              echo "❌ ${BLOCKING[$i]}: ${RESULTS[$i]}"
              FAILED=1
            fi
          done
          # Semgrep e Trivy: aviso mas não bloqueiam (remover continue-on-error quando baseline limpa)
          echo "ℹ️  Semgrep: ${{ needs.semgrep.result }}"
          echo "ℹ️  Trivy: ${{ needs.trivy.result }}"
          [[ $FAILED -eq 0 ]] && echo "✅ Todos os checks obrigatórios passaram!" || exit 1
