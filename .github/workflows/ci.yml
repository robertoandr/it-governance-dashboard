# ============================================
# CI Pipeline — IT Governance Dashboard
# Roda em: push (main/develop) e pull requests
# ============================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # permite rodar manualmente

# Cancela runs anteriores no mesmo PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.12"

jobs:
  # ============================================
  # JOB 1: Lint (rápido, falha cedo)
  # ============================================
  lint:
    name: 🎨 Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff Check
        run: ruff check . --output-format=github

      - name: Ruff Format Check
        run: ruff format --check .

  # ============================================
  # JOB 2: Security (Bandit + pip-audit)
  # ============================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install security tools
        run: pip install "bandit[toml]" pip-audit

      - name: Bandit (static analysis)
        run: bandit -c pyproject.toml -r . -ll -f json -o bandit-report.json || true

      - name: Bandit (human output)
        run: bandit -c pyproject.toml -r . --severity-level medium
        continue-on-error: true   # TODO: remover após resolver issues Medium+

      - name: pip-audit (CVE check)
        run: pip-audit -r requirements.txt --desc || true
        continue-on-error: true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  # ============================================
  # JOB 3: Tests (matrix de Python)
  # ============================================
  test:
    name: 🧪 Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          INFLUX_URL: http://localhost:8086
          INFLUX_TOKEN: ci-fake-token-not-real
          INFLUX_ORG: ci-test-org
          INFLUX_BUCKET: ci-test-bucket
          SECRET_KEY: ci-test-secret-key
          OPS_PIN: TEST_PIN_1234
          FLASK_ENV: testing
        run: |
          pytest --cov=. \
                 --cov-report=xml \
                 --cov-report=term-missing \
                 --junitxml=junit.xml \
                 -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
            htmlcov/
          retention-days: 30
  # ============================================
  # JOB 3.5: Type Check (Mypy - apenas services/)
  # ============================================
  typecheck:
    name: 🔬 Type Check (Mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run mypy on services/
        run: mypy services/


  # ============================================
  # JOB 4: Build smoke test (importa app)
  # ============================================
  smoke:
    name: 💨 Smoke Test (app boot)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Smoke import test
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-smoke-test-key
          # InfluxDB (obrigatórias)
          INFLUX_URL: http://localhost:8086
          INFLUX_TOKEN: ci-fake-token-not-real
          INFLUX_ORG: ci-test-org
          INFLUX_BUCKET: ci-test-bucket
          # Zabbix (obrigatórias)
          ZABBIX_URL: http://localhost:8080/api_jsonrpc.php
          ZABBIX_USER: ci-smoke-user
          ZABBIX_PASSWORD: ci-fake-password-not-real
          ZABBIX_FRONT_URL: http://localhost:8080  # workaround: _env("X", "") bug (see #TBD)
        run: |
          python -c "import app; print('✅ App importa OK')"
          python -c "from app import app as flask_app; print(f'✅ Flask app: {flask_app.name}')"

  # ============================================
  # JOB 5: All Green (status final)
  # ============================================
  all-checks:
    name: ✅ All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, security, test, typecheck, smoke]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.smoke.result }}" != "success" ]]; then
            echo "❌ Um ou mais jobs falharam"
            exit 1
          fi
          echo "✅ Todos os checks passaram!"
