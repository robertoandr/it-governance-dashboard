---
# Template Zabbix: auto-monitoramento do dashboard-ti
# Importar via: Zabbix UI > Configuration > Templates > Import
# Ou via zabbix_api (ver scripts/import_template.py)
#
# Postmortem ref: 2026-06-07 — crash loop detectado tarde demais
# Meta: detecção de incidente < 1min (antes: horas/dias)

zabbix_export:
  version: '7.0'
  templates:
    - template: 'Template App Dashboard-TI Self-Monitoring'
      name: 'Dashboard-TI Self-Monitoring'
      description: |
        Auto-monitoramento do serviço dashboard-ti (porta 8082).
        Detecta: service down, health endpoint down, crash loop.
        Ref: postmortem 2026-06-07.
      groups:
        - name: 'Templates/Applications'

      items:
        - name: 'Dashboard-TI: systemd active state'
          key: 'systemd.unit.info[dashboard-ti.service,ActiveState]'
          delay: 30s
          history: 7d
          value_type: CHAR
          description: 'Estado ativo do serviço (active/inactive/failed/activating)'

        - name: 'Dashboard-TI: número de restarts'
          key: 'systemd.unit.info[dashboard-ti.service,NRestarts]'
          delay: 1m
          history: 30d
          value_type: UNSIGNED
          description: 'Contador acumulado de restarts desde o boot'

        - name: 'Dashboard-TI: HTTP /health'
          key: 'web.page.regexp[http://127.0.0.1:8082/health,"\"status\": \"ok\"",,,200]'
          delay: 1m
          history: 30d
          value_type: UNSIGNED
          description: 'Retorna 1 se /health responde 200 com status ok, 0 caso contrário'

        - name: 'Dashboard-TI: tempo de resposta /health'
          key: 'net.tcp.service.perf[http,127.0.0.1,8082]'
          delay: 1m
          history: 30d
          value_type: FLOAT
          units: s
          description: 'Tempo de conexão TCP à porta 8082'

      triggers:
        - name: 'Dashboard-TI: serviço systemd não está ativo'
          expression: >-
            last(/Template App Dashboard-TI Self-Monitoring/systemd.unit.info[dashboard-ti.service,ActiveState])<>"active"
          priority: HIGH
          description: 'O serviço dashboard-ti.service saiu do estado active. Verificar journalctl -u dashboard-ti.'
          manual_close: 'YES'

        - name: 'Dashboard-TI: health endpoint com falha'
          expression: >-
            last(/Template App Dashboard-TI Self-Monitoring/web.page.regexp[http://127.0.0.1:8082/health,"\"status\": \"ok\"",,,200])=0
          priority: HIGH
          description: 'O endpoint /health não retornou 200 ou JSON inválido. App pode estar travado sem crash.'
          manual_close: 'YES'
          dependencies:
            - name: 'Dashboard-TI: serviço systemd não está ativo'

        - name: 'Dashboard-TI: crash loop detectado (≥3 restarts em 5min)'
          expression: >-
            change(/Template App Dashboard-TI Self-Monitoring/systemd.unit.info[dashboard-ti.service,NRestarts])>=3
          priority: AVERAGE
          description: 'O serviço reiniciou 3+ vezes recentemente. Provável crash loop. Ver journalctl -u dashboard-ti -n 100.'
          manual_close: 'YES'

        - name: 'Dashboard-TI: latência alta no /health (>2s)'
          expression: >-
            last(/Template App Dashboard-TI Self-Monitoring/net.tcp.service.perf[http,127.0.0.1,8082])>2
          priority: WARNING
          description: 'Tempo de conexão TCP > 2s indica sobrecarga ou travamento parcial.'
          manual_close: 'YES'
