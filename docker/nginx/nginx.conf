worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 443 ssl;
        server_name noc.grupogadens.com.br;
        ssl_certificate     /etc/nginx/certs/noc.grupogadens.com.br.crt;
        ssl_certificate_key /etc/nginx/certs/noc.grupogadens.com.br.key;

        location / {
            proxy_pass http://app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Painel da TV do NOC (/gov/tv/<token>, sem login). Além do token, só
        # abre de redes internas; para fixar no aparelho, troque pelas linhas
        # "allow <IP da TV>;". access_log off: o token vai na URL.
        location ^~ /gov/tv/ {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            access_log off;
            proxy_pass http://app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Mapa de Câmeras (mapa-cameras.service no host). Só passa quem tem
        # sessão na dashboard com perfil admin/gestor — ver dashboards.mapa_cameras_auth.
        location /mapa-cameras/ {
            auth_request /_auth/mapa-cameras;
            error_page 401 = @login_mapa_cameras;

            proxy_pass http://host.docker.internal:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cookie_path / /mapa-cameras/;
            proxy_read_timeout 120s;      # exportação Word/Excel grande
            client_max_body_size 60m;     # upload de fotos e plantas

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "frame-ancestors 'self'" always;

            # V2.0: "Gravadores" vira "Dispositivos de Infra" na tela. O binário
            # não tem fonte aqui, então a troca é feita na resposta. Só textos
            # exibidos: "gravador" também é chave de campo no JS, e sub_filter
            # ignora maiúsculas — por isso os padrões levam aspas/contexto.
            # Exportações Word/Excel e grupos do Zabbix (gerados no Go) não mudam.
            proxy_set_header Accept-Encoding "";
            sub_filter_types text/javascript;
            sub_filter_once off;
            sub_filter "'Gravador (NVR/DVR)'" "'Dispositivo de Infra'";
            sub_filter "'Gravadores'" "'Dispositivos de Infra'";
            sub_filter "|| 'Gravador')" "|| 'Dispositivo de Infra')";
            sub_filter "'Gravador: '" "'Dispositivo de Infra: '";
            sub_filter "add('Gravador'," "add('Dispositivo de Infra',";
            sub_filter '>Gravador <select id="fDev">' '>Dispositivo de Infra <select id="fDev">';
        }

        location = /_auth/mapa-cameras {
            internal;
            proxy_pass http://app:5000/gov/cameras/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @login_mapa_cameras {
            return 302 /gov/login?next=/gov/cameras;
        }
    }

    server {
        listen 80;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
}
