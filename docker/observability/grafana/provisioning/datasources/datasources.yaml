apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: "15s"

  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
      serviceMap:
        datasourceUid: prometheus
      lokiSearch:
        datasourceUid: loki

  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"traceId":"(\w+)"'
          name: TraceID
          url: "$${__value.raw}"

  - name: Zendesk
    type: yesoreyeram-infinity-datasource
    uid: zendesk
    jsonData:
      auth_method: basicAuth
      allowedHosts:
        - https://grupogadens.zendesk.com
    basicAuth: true
    basicAuthUser: roberto@grupogadens.com.br/token
    secureJsonData:
      basicAuthPassword: $__env{ZD_TOKEN}
