apiVersion: 1

groups:
  - orgId: 1
    name: M365 Collector
    folder: M365
    interval: 1m
    rules:

      - uid: m365-collector-down
        title: M365CollectorDown
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(itgov_m365_collections_total[15m])) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: eq
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 30m
        annotations:
          summary: "M365 collector has not run in 30 minutes"
          description: "No collections recorded in the last 30 minutes for any tenant. Check collector logs."
        labels:
          severity: critical
          team: sre

      - uid: m365-high-error-rate
        title: M365HighErrorRate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                sum(rate(itgov_m365_collections_total{status="error"}[10m]))
                /
                (sum(rate(itgov_m365_collections_total[10m])) + 0.001)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0.10]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: "M365 collection error rate > 10%"
          description: "More than 10% of M365 collection cycles are failing."
        labels:
          severity: warning
          team: sre

      - uid: m365-rate-limit-spike
        title: M365RateLimitSpike
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: rate(itgov_m365_graph_errors_total{error_type="rate_limit"}[1m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [0.5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Graph API rate limit errors spiking"
          description: "Rate limit errors exceeding 0.5/s for 5 minutes. Collector may be throttled."
        labels:
          severity: warning
          team: sre

      - uid: m365-critical-orphans-spike
        title: M365CriticalOrphansSpike
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                itgov_m365_sps_risk_count{risk_level="critical"}
                - itgov_m365_sps_risk_count{risk_level="critical"} offset 1h
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 0m
        annotations:
          summary: "Critical SP orphans increased by >5 in the last hour"
          description: "Number of critical-risk Service Principals grew by more than 5 in 1 hour."
        labels:
          severity: info
          team: governance

      - uid: m365-high-latency-p95
        title: M365HighLatencyP95
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                histogram_quantile(0.95,
                  sum(rate(itgov_m365_graph_request_duration_seconds_bucket[5m])) by (le)
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              conditions:
                - evaluator:
                    params: [2.0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: "Graph API p95 latency > 2s"
          description: "95th percentile of Graph API request latency exceeds 2 seconds for 10 minutes."
        labels:
          severity: warning
          team: sre
