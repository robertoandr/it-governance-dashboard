global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # app metrics via host network (Linux: bridge gateway IP, not host.docker.internal)
  - job_name: itgov
    static_configs:
      - targets: ["172.17.0.1:9464"]
