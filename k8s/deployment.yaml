# IT Governance Dashboard — Kubernetes Deployment
# Probes:
#   Liveness  → GET /api/health        (process alive, never checks deps)
#   Readiness → GET /api/health/ready  (deps healthy — InfluxDB, disk)
#
# startupProbe handles the heavy import boot time (~8-12s with Flask + SQLAlchemy
# + influxdb-client + httpx). After startup passes, liveness/readiness run without
# initialDelay, avoiding guessing static boot times across different node classes.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: itgov-dashboard
  namespace: itgov
  labels:
    app: itgov-dashboard
    version: "1.1.0"
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: itgov-dashboard
  template:
    metadata:
      labels:
        app: itgov-dashboard
        version: "1.1.0"
    spec:
      serviceAccountName: itgov-dashboard-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
        - name: itgov-dashboard
          image: ghcr.io/robertoandr/it-governance-dashboard:latest  # pin to sha256 in prod
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          envFrom:
            - secretRef:
                name: itgov-dashboard-secrets  # INFLUX_URL, INFLUX_TOKEN, SECRET_KEY, etc.
          # ── Startup probe: allows up to 60s for initial boot ──────────────
          # 12 failures × 5s period = 60s max startup window.
          # Once startup succeeds, kubelet switches to liveness/readiness.
          startupProbe:
            httpGet:
              path: /api/health
              port: 8000
            failureThreshold: 12
            periodSeconds: 5
            timeoutSeconds: 3
          # ── Liveness: restart the container if the process is stuck ───────
          # Flask process alive check only — no external calls.
          # 3 failures × 10s = 30s window before container restart.
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # ── Readiness: gate traffic on dependency health ───────────────────
          # Checks InfluxDB connectivity + disk space.
          # 2 failures × 5s = 10s before pod is excluded from Service endpoints.
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
            successThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Flask-Session writes session files to disk
            capabilities:
              drop:
                - ALL
